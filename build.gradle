plugins {
    id 'fabric-loom' version '1.14.10'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { url = 'https://masa.dy.fi/maven' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "carpet:fabric-carpet:${project.carpet_version}"
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.register('verifyReverseSmelting', JavaExec) {
    group = 'verification'
    description = 'Verify reverse recipe data, rule toggles and cached recipe ID matching against Minecraft 1.21.1.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.mikufeather.carpetmkf.recipe.ReverseSmeltingVerification'
}
// The test source is an executable Minecraft bootstrap check, not a JUnit class.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'verifyReverseSmelting' }
